<!DOCTYPE html>
<html lang="en-us" data-bs-theme="dark">
  <head>
    <title>{% if page.title %}{{ page.title }} – {% endif %}{{ site.name }}</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="{{ site.baseurl }}/css/bsdark.css" />
    <link rel="stylesheet" href="{{ site.baseurl }}/css/style.css" />
    <link rel="sitemap" type="application/xml" title="Sitemap" href="{{ site.baseurl }}/sitemap.xml" />
    <link rel="shortcut icon" href="data:," />
    <meta name="theme-color" content="#0a0a0a" />
    <meta http-equiv="Content-Security-Policy" content="script-src 'none'; object-src 'none'; base-uri 'self'">
    <meta http-equiv="Referrer-Policy" content="no-referrer">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta name="color-scheme" content="light dark">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ site.url }}/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ site.url }}/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ site.url }}/favicon/favicon-16x16.png">
    <meta name="robots" content="noai, noimageai, DisallowAITraining">
    {% seo title=false %} {% feed_meta %} 
  </head>
  <body class="container">
    
    {% unless page.navbar == false %}
    <nav>
      <ul>
        <li><strong>{{ site.name }}</strong></li>
        <li><a href="{{ site.baseurl }}/" {% if page.url == "/" %}aria-current="page"{% endif %}>/home</a></li>
        <li><a href="{{ site.baseurl }}/about/" {% if page.url == "/about/" %}aria-current="page"{% endif %}>/about</a></li>
        <li><a href="{{ site.baseurl }}/feed.xml">/rss</a></li>
      </ul>
    </nav>
    {% endunless %}
    
    {% if page.title %}
      <div class="header">
        <h1>{{ page.title }}</h1>
        {% if page.date %}
          <p class="post-date"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%F" }}</time></p>
        {% endif %}
      </div>
    {% endif %}
    
    <div class="page-content">{{ content }}</div>

  </body>
</html>
